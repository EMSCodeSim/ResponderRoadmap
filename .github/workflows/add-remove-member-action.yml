name: Add safe Remove Member action
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-remove-member-action.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update People roster and protect member records
        run: python3 scripts/add-remove-member-action.py
      - name: Commit and push People update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/(portal)/members/page.tsx' src/server/services/members.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Add confirmed member deactivation to People roster'
          git push origin main
