name: Apply AI review build fix

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-ai-review-newline.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply fix
        run: python scripts/fix-ai-review-newline.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/(portal)/task-books/[id]/page.tsx'
          git diff --cached --quiet || git commit -m "Fix AI Task Book review build"
          git push
