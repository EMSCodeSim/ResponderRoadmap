name: Apply AI task book interview

on:
  push:
    branches: [main]
    paths:
      - "scripts/add-ai-taskbook-interview.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply interview update
        run: python scripts/add-ai-taskbook-interview.py
      - name: Commit generated builder update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/(portal)/task-books/new/page.tsx"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add personalized AI task book interview"
          git push
