name: Apply assignment review hardening

on:
  push:
    paths:
      - "scripts/harden-assignment-review-workflow.py"
      - ".github/workflows/apply-assignment-review-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harden assignment review workflow
        run: python scripts/harden-assignment-review-workflow.py
      - name: Commit workflow hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/services/assignments.ts
          git diff --cached --quiet && exit 0
          git commit -m "Harden assignment evaluator authorization"
          git push origin main
