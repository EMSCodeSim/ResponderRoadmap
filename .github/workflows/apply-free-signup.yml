name: Apply self-service free signup hardening

on:
  push:
    branches: [feature/self-service-free-signup]
    paths:
      - scripts/harden-free-signup.py
      - .github/workflows/apply-free-signup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/self-service-free-signup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harden alternate department creation
        run: python scripts/harden-free-signup.py
      - name: Commit application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server/services/auth.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Ensure new departments created through onboarding use free tier'
          git push origin HEAD:feature/self-service-free-signup
