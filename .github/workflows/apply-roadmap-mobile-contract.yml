name: Apply Roadmap mobile contract

on:
  push:
    paths:
      - "scripts/implement-roadmap-mobile-contract.py"
      - ".github/workflows/apply-roadmap-mobile-contract.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Restore full implementation generator
        run: git show 864980c6cb30f2b9ddf7518671a8551a2e11d725:scripts/implement-roadmap-mobile-contract.py > /tmp/implement-roadmap-mobile-contract.py
      - name: Apply backend and app contract
        run: python /tmp/implement-roadmap-mobile-contract.py
      - name: Repair generated qualification lint types
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server/services/qualifications.ts')
          s = p.read_text()
          s = s.replace('export async function createRole(ctx: AuthContext, input: any) {', '''type CreateRoleInput = {
            name?: unknown;
            category?: unknown;
            description?: unknown;
            credentialTypeIds?: unknown[];
            taskBookTemplateIds?: unknown[];
            requirementIds?: unknown[];
            manualApprovalRequired?: boolean;
          };

          type AuthorizationInput = {
            status?: unknown;
            restriction?: unknown;
            note?: unknown;
            reviewDate?: string | null;
          };

          export async function createRole(ctx: AuthContext, input: CreateRoleInput) {''')
          s = s.replace('export async function setAuthorization(ctx: AuthContext, membershipId: string, roleId: string, input: any) {', 'export async function setAuthorization(ctx: AuthContext, membershipId: string, roleId: string, input: AuthorizationInput) {')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format and validate Prisma schema
        run: |
          npx prisma format
          npx prisma validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/responderroadmap
      - name: Type and lint validation
        run: npm run lint
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma src/server/api/router.ts src/server/services/classes.ts src/server/services/qualifications.ts docs/dreamflow-app-contract.md
          git diff --cached --quiet && exit 0
          git commit -m "Implement qualifications, training RMS handoff, and app contract (#114 #115 #116)"
          git push origin main
