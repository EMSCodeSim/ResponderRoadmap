name: Apply SEO sitemap update

on:
  push:
    branches: [main]
    paths:
      - scripts/add-seo-page-to-sitemap.py
      - .github/workflows/apply-seo-sitemap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add public SEO page to sitemap
        run: python scripts/add-seo-page-to-sitemap.py
      - name: Commit sitemap
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/sitemap.ts
          git commit -m "Add firefighter task book page to sitemap"
          git push origin main
