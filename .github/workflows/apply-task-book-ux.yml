name: Apply Task Book UX refinements
on:
  push:
    branches: [feature/simplify-task-books-workspace]
    paths: [.github/workflows/apply-task-book-ux.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/simplify-task-books-workspace
      - name: Apply scoped UI refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              file = Path(path)
              content = file.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:90]}')
              file.write_text(content.replace(old, new, 1))
          shell = 'src/components/AppShell.tsx'
          replace_once(shell,
              '{ href: "/single-assignments", label: "Assignments", icon: ClipboardList, visible: allowed.has("training-assignments"), paths: ["/single-assignments", "/training-assignments"] },',
              '{ href: allowed.has("training-assignments") ? "/single-assignments" : "/my-assignments", label: "Assignments", icon: ClipboardList, visible: allowed.has("training-assignments") || allowed.has("my-task-books"), paths: ["/single-assignments", "/training-assignments", "/my-assignments"] },')
          editor = 'src/app/(portal)/task-books/[id]/page.tsx'
          replace_once(editor,
              '          <div className="mt-3">\n            <Field label="Intended position">',
              '          <details className="mt-3 rounded-md border border-navy-200 p-3">\n            <summary className="cursor-pointer text-sm font-semibold text-navy-700">More Task Book details</summary>\n            <div className="mt-3">\n            <Field label="Intended position">')
          replace_once(editor,
              '              <TextArea value={description} onChange={(e) => { setDescription(e.target.value); markDirty(); }} disabled={draftLocked} />\n            </Field>\n          </div>\n          <div className="kicker mt-4 mb-2">Sections</div>',
              '              <TextArea value={description} onChange={(e) => { setDescription(e.target.value); markDirty(); }} disabled={draftLocked} />\n            </Field>\n          </div>\n          </details>\n          <div className="kicker mt-4 mb-2">Sections</div>')
          replace_once(editor,
              '      <div className="grid gap-4 xl:grid-cols-[240px_1fr_340px]">',
              '      <nav aria-label="Task Book builder steps" className="mb-4 flex flex-wrap items-center gap-2 rounded-lg border border-navy-200 bg-white p-3 text-sm font-semibold">\n        <a href="#book-details" className="rounded-md bg-navy-100 px-3 py-2 text-navy-800 hover:bg-navy-200">1. Details</a>\n        <a href="#book-requirements" className="rounded-md bg-navy-100 px-3 py-2 text-navy-800 hover:bg-navy-200">2. Requirements</a>\n        {!draftLocked ? <button type="button" onClick={() => setReviewOpen(true)} className="rounded-md bg-fire px-3 py-2 text-white hover:bg-fire-dark">3. Review & publish</button> : <span className="px-3 py-2 text-navy-500">Published version</span>}\n      </nav>\n      <div className="grid gap-4 xl:grid-cols-[240px_1fr_340px]">')
          replace_once(editor,
              '      <div className="grid gap-4 xl:grid-cols-[240px_1fr_340px]">\n        <Card className="p-3">',
              '      <div className="grid gap-4 xl:grid-cols-[240px_1fr_340px]">\n        <Card id="book-details" className="p-3">')
          replace_once(editor,
              '        <Card className="p-4">\n          {current ? (',
              '        <Card id="book-requirements" className="p-4">\n          {current ? (')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AppShell.tsx 'src/app/(portal)/task-books/[id]/page.tsx'
          git commit -m 'Guide builder steps and preserve member single-task access'
          git push origin HEAD:feature/simplify-task-books-workspace
