name: ResponderRoadmap CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: responderroadmap
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/responderroadmap
      AUTH_SECRET: ci-only-secret-not-for-production
      PLATFORM_ADMIN_EMAILS: owner@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply production database schema
        run: npx prisma db push

      - name: Provision isolated demo database
        run: npm run db:demo:setup

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build
