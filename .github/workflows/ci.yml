name: ResponderRoadmap CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: responderroadmap
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/responderroadmap
      AUTH_SECRET: ci-only-secret-not-for-production
      PLATFORM_ADMIN_EMAILS: owner@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply production database schema
        run: npx prisma db push

      - name: Provision isolated demo database
        run: npm run db:demo:setup

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build

      # All requests target the local server with disposable CI Postgres and demo schemas.
      # Never run destructive QA against actual production or real customer accounts.
      - name: Test end-to-end HTTP workflows on isolated database
        run: |
          npm run start > /tmp/responder-roadmap-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/responder-roadmap-qa-server.log
            exit 1
          fi
          BASE_URL=http://127.0.0.1:3000 bash scripts/smoke-http.sh
          BASE_URL=http://127.0.0.1:3000 bash scripts/smoke-training-workflows.sh
          BASE_URL=http://127.0.0.1:3000 bash scripts/smoke-class-results.sh
          BASE_URL=http://127.0.0.1:3000 bash scripts/smoke-qr-registration.sh
          BASE_URL=http://127.0.0.1:3000 bash scripts/smoke-member-qr.sh
