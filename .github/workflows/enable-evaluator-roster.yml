name: Enable evaluator roster add and remove
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-evaluator-roster.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update evaluator roster UI and services
        run: python3 scripts/enable-evaluator-roster-management.py
      - name: Commit and push feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/(portal)/evaluators/page.tsx' src/server/services/evaluators.ts src/server/api/router.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Allow authorized officers to add and remove evaluators safely'
          git push origin main
