name: Finalize simplified navigation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-simple-navigation.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair quick assignment tabs and navigation shortcuts
        run: python3 scripts/finalize-simplified-navigation.py
      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/(portal)/training-assignments/page.tsx' src/components/AppShell.tsx 'src/app/(portal)/dashboard/page.tsx'
          git diff --cached --quiet && exit 0
          git commit -m 'Complete simplified navigation with accessible action shortcuts'
          git push origin main
