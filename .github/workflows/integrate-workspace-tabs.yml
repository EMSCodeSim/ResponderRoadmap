name: Integrate Task Books workspace
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-workspace-tabs.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Integrate role-aware tabs into existing pages
        run: python3 scripts/add-workspace-tabs.py
      - name: Commit and push updated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/(portal)/task-books/page.tsx' 'src/app/(portal)/my-task-books/page.tsx' 'src/app/(portal)/assignments/page.tsx' 'src/app/(portal)/training-assignments/page.tsx' 'src/app/(portal)/evaluate/page.tsx'
          git diff --cached --quiet && exit 0
          git commit -m 'Unify Task Books assignments and evaluations with shared tabs'
          git push origin main
