name: Reconcile assignment feature with main
on:
  push:
    branches: [feature/single-assignment-workspace]
    paths: [.github/workflows/reconcile-single-assignments.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/single-assignment-workspace
          fetch-depth: 0
      - name: Merge latest main without dropping other changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts: $conflicts"
            if [ "$conflicts" != "package-lock.json" ]; then
              echo 'Unexpected conflict: aborting rather than overwriting source changes'
              exit 1
            fi
            git checkout --theirs package-lock.json
            git add package-lock.json
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m 'Merge concurrent instructor role and preserve assignment workspace'
          fi
          git push origin HEAD:feature/single-assignment-workspace
