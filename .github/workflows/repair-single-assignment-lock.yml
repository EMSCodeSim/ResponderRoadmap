name: Regenerate assignment branch lockfile
on:
  push:
    branches: [feature/single-assignment-workspace]
    paths: [.github/workflows/repair-single-assignment-lock.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/single-assignment-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recreate valid npm lockfile from package manifest
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const l=require("./package-lock.json"); if(l.lockfileVersion < 1) process.exit(1)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Regenerate valid npm lockfile for current dependencies'
          git push origin HEAD:feature/single-assignment-workspace
