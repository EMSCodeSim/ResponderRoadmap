name: Resize AI Task Book input

on:
  push:
    paths:
      - '.github/workflows/resize-ai-taskbook-input.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enlarge AI text areas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/(portal)/task-books/new/page.tsx')
          s = p.read_text()
          old_main = 'className="min-h-36"\n                  placeholder="Create a 12-month probationary firefighter Task Book'
          new_main = 'className="min-h-64 w-full text-base leading-relaxed"\n                  rows={10}\n                  placeholder="Create a 12-month probationary firefighter Task Book'
          if old_main not in s:
              raise SystemExit('Main AI prompt textarea anchor not found')
          s = s.replace(old_main, new_main, 1)
          old_interview = 'className="min-h-28"\n                      placeholder={AI_INTERVIEW_QUESTIONS[aiQuestionIndex].placeholder}'
          new_interview = 'className="min-h-40 w-full text-base leading-relaxed"\n                      rows={6}\n                      placeholder={AI_INTERVIEW_QUESTIONS[aiQuestionIndex].placeholder}'
          if old_interview not in s:
              raise SystemExit('Interview textarea anchor not found')
          s = s.replace(old_interview, new_interview, 1)
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/(portal)/task-books/new/page.tsx'
          git commit -m 'Enlarge AI task book input fields'
          git push
